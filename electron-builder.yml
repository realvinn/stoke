appId: dev.vinn.stoke
productName: Stoke
# Where electron-updater looks for new versions. Publishing a GitHub release
# with the installer and the generated latest.yml is what makes installed copies
# notice an update.
publish:
  provider: github
  owner: realvinn
  repo: stoke
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
# @lydell/node-pty ships prebuilt .node binaries; they must live outside the asar
# archive so the OS loader can dlopen them.
asarUnpack:
  - '**/node_modules/@lydell/node-pty*/**'
# build/icon.png (1024x1024) is the single source; electron-builder derives the
# .ico and .icns from it. Regenerate with `npm run icon` after editing icon.svg.
# Architectures are chosen by the npm scripts (--x64 / --arm64) rather than
# pinned here: an explicit `arch:` list in this file overrides the CLI flag, so
# `dist:win --x64` would still build every architecture and take three times as
# long.
win:
  icon: build/icon.png
  # Two targets from ONE invocation: the installer, and a portable zip of the
  # same win-unpacked folder. One invocation is what makes the zip complete:
  # PublishManager's onAfterPack writes resources/app-update.yml into
  # win-unpacked (PublishManager.js:75-89) BEFORE either target packs it, so
  # the zip carries the same feed config the installer does, with Stoke.exe at
  # the zip's root (ArchiveTarget.js:47, `withoutDir` for everything but mac).
  # A Windows zip gets no latest.yml entry and no blockmap of its own
  # (ArchiveTarget's isWriteUpdateInfo defaults false, and targetFactory
  # never passes true for win): scripts/add-portable-to-manifest.mjs appends
  # it to the merged feed in the publish job instead.
  target:
    - target: nsis
    - target: zip
  # Two names, and the split is forced. `artifactPatternConfig`
  # (platformPackager.js:551-556) takes the target's own options first, then
  # this block's artifactName, then the top-level one. NsisTarget passes
  # `config.nsis` as its options (NsisTarget.js:137), so nsis.artifactName
  # below names the installer. A win zip's options are `config.zip`, which is
  # not a key electron-builder accepts at the top level at all (scheme.json,
  # additionalProperties false) — so the zip can only be named HERE. Not by a
  # top-level artifactName either: that is the fallback for every target with
  # no name of its own, which here is the Linux AppImage, whose version-only
  # name the one-line installer and the publish gate both rely on.
  #
  # `-win` is not decoration. Without it the zip is
  # `Stoke-<version>-<arch>.zip`, which is exactly the mac zip's name — a
  # Windows x64 job and a macOS x64 job would both produce
  # `Stoke-0.9.9-x64.zip`, and the publish job's merge refuses a release with
  # two assets under one name (merge-update-manifests.mjs's mergeTree), which
  # beats the alternative of one silently replacing the other. src/shared/
  # installKind.ts's portableAssetFor finds the zip by that same `-<arch>-win`.
  artifactName: ${productName}-${version}-${arch}-win.${ext}
  # The `stoke` command for cmd and PowerShell, at <install>\resources\bin,
  # which is the folder Settings > Updates > Command line puts on PATH. Its
  # path to Stoke.exe (`%~dp0..\..`) depends on landing exactly here.
  extraResources:
    - from: build/bin/stoke.cmd
      to: bin/stoke.cmd
nsis:
  # The installer's name, unchanged from every release so far: install.ps1,
  # the worker and every latest.yml already in the wild name
  # `Stoke-<version>-<arch>-setup.exe`. Moved here from `win.artifactName`
  # because that key now names the portable zip (see the win block).
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Stoke
  # Installer artwork. The SVG sources sit beside the bitmaps in build/ and
  # `npm run art` regenerates them; `npm run verify:installer-art` asserts the
  # format, because electron-builder validates none of it (a wrong-format BMP is
  # a makensis WARNING, a blank image and a green build).
  #
  # These three paths are what electron-builder would find by itself anyway, and
  # naming them is still worth it: an UNSET key whose default file is missing or
  # misspelled falls silently back to NSIS's stock nsis3-metro sidebar, while a
  # SET key whose file is missing throws InvalidConfigurationError and stops the
  # build. Explicit turns a silent downgrade into a loud failure.
  #
  # One key deliberately absent. `installerHeaderIcon` only ever reaches the
  # script inside NsisTarget's `if (oneClick)` branch, and oneClick is false
  # here, so adding it would silently do nothing.
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  # The one script Stoke owns, and it does exactly two things. It adds the
  # welcome page: without it MUI_WELCOMEFINISHPAGE_BITMAP -- i.e.
  # installerSidebar.bmp above -- is read by no installer page until
  # MUI_PAGE_FINISH, so the art shows once, at the end, after every decision
  # has been made. And it replaces the stock "is Stoke running?" step, which
  # under /S (winget, the one-liner, a self-update) force-kills every process
  # in the install folder and orphans every `claude` Stoke was running, with
  # one that asks Stoke to close its window and waits. See the file; it
  # explains what it does not set and why.
  #
  # `include`, never `script`. `script` replaces the whole generated script and
  # takes the uninstaller's generation AND its signing with it. Named rather
  # than left to default to this same path, for the same reason as the three
  # images above: a SET key whose file is missing stops the build, an UNSET one
  # loses the page in silence.
  include: build/installer.nsh
mac:
  icon: build/icon.png
  # Pinned, not auto-discovered. There is more than one code-signing identity in
  # this keychain — "Stoke" and a leftover "MyTouchBar Local" from an unrelated
  # project — and auto-discovery picks one without saying which. Every release up
  # to 0.5.4 was signed by the leftover, which is how a Stoke app came to be
  # signed by a certificate named after a touch bar.
  #
  # CI overrides this on the command line with `-c.mac.identity=-` (ad-hoc),
  # because the runner has no keychain. A CLI `-c.` value beats the file, which
  # was verified rather than assumed — see the release workflow.
  identity: Stoke
  # Both targets, and the zip is not optional. A dmg is what a person downloads;
  # a zip is the only thing electron-updater can install on macOS. Squirrel.Mac
  # updates by swapping an .app out of an archive, so `MacUpdater` searches the
  # feed for a .zip and rejects "dmg" and "pkg" by name — with a dmg-only target
  # it throws ERR_UPDATER_ZIP_FILE_NOT_FOUND before downloading a byte
  # (electron-updater 6.8.9, out/MacUpdater.js:81-83). Every release up to and
  # including v0.4.0-beta.3 shipped a dmg-only latest-mac.yml and so could not
  # update a Mac at all, while reporting an update was available.
  target:
    - target: dmg
    - target: zip
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}.${ext}
  # The `stoke` command: Contents/Resources/bin/stoke, a POSIX sh script that
  # ~/.local/bin/stoke links to. A script in Resources is sealed as a resource
  # by the signature rather than signed as code, so `codesign --verify --strict
  # --deep` still covers it. Mac and Windows only: on Linux the command is the
  # launcher the installer writes, since a link into an AppImage's mount would
  # point at /tmp.
  extraResources:
    - from: build/bin/stoke
      to: bin/stoke
  # A PTY spawns child processes; the JIT/unsigned-memory entitlements keep
  # hardened runtime from killing them.
  #
  # Signing is left on auto-discovery. With no Developer ID installed,
  # electron-builder falls back to an ad-hoc signature, which is enough for a
  # personal build — Apple Silicon refuses to launch arm64 binaries that carry
  # no signature at all. See BUILDING.md if macOS still objects.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Required, not advisory. macOS terminates a process that asks for the
    # microphone with no usage string — it does not deny the request — so
    # omitting this turns dictation into an unexplained crash. The text is what
    # the system permission prompt shows, so it says who is listening and why.
    #
    # It has to speak for the CLIs too. A `claude` in a Stoke tab records as
    # Stoke — TCC attributes a pty child to its responsible process, measured
    # 2026-09-19 — so the prompt a first `/voice` raises is THIS one, and the
    # old text ("audio is sent only to the speech server you configure") was
    # false for it: Claude Code streams to Anthropic's speech service.
    NSMicrophoneUsageDescription: >-
      Stoke and the coding CLIs it runs use the microphone for voice input:
      Claude Code's /voice records through Stoke, and so does Stoke's own
      dictation. Stoke's dictation sends audio only to the speech server you
      configure; a CLI's voice mode sends it to that CLI's own service. Nothing
      goes to Stoke's developers.
dmg:
  # build/background@2x.png (1080x760) is picked up automatically beside it:
  # dmg-builder merges the pair with `tiffutil -cathidpicheck` and sizes the
  # Finder window from the @1x rep. Naming the @1x here rather than leaving it
  # to auto-discovery has the same payoff as the nsis keys above -- a missing
  # file becomes an error instead of a silent fall back to electron-builder's
  # own default background.
  #
  # `dmg.window` is deliberately NOT set. The window is derived from this
  # image's own size (dmgUtil's customizeDmg runs sips on it), so setting both
  # is how the art and the window come apart. `dmg.contents` is left at its
  # defaults too -- app at 130,220 and /Applications at 410,220 -- because
  # build/background.svg is composed around exactly those coordinates.
  background: build/background.png
linux:
  # AppImage and nothing else, for one reason: it is the only Linux format
  # electron-updater can install without elevation. AppImageUpdater replaces the
  # file in place; DebUpdater and RpmUpdater shell out to the package manager,
  # which brings sudo/pkexec, a `package-type` marker file and a second updater
  # path into scope. A tar.gz is worse than either — there is no TarUpdater at
  # all, and AppImageUpdater.isUpdaterActive() returns false unless the runtime
  # set $APPIMAGE, so an unpacked tarball can never update itself by any route.
  # A one-line installer that laid one down would be creating installs that go
  # stale in silence, which is the failure this whole release round is about.
  target: [AppImage]
  category: Development
# Which AppImage runtime gets built, and it is not cosmetic.
#
# With no toolsets.appimage key, AppImageTarget.build takes
# buildLegacyFuse2AppImage (`if (appimageTool == null || appimageTool ===
# "0.0.0")`) — the classic type-2 runtime that dlopens libfuse.so.2, which is
# absent by default on Ubuntu 22.04 and 24.04. That is the familiar
# "fuse: failed to open /dev/fuse" refusal, i.e. a file most people cannot run.
# Naming a version switches it to buildStaticRuntimeAppImage, whose runtime has
# FUSE 3 built in and needs nothing installed. `--appimage-extract-and-run` is
# still the escape hatch inside a container.
#
# electron-builder's own scheme labels 1.0.2 and 1.0.3 "Betas" and defaults to
# 0.0.0, so this is a deliberate choice of the newer runtime over the one that
# will not start. Nobody here has run either: no Stoke build has ever been
# launched on Linux at all.
toolsets:
  appimage: '1.0.3'
