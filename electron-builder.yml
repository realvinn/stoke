appId: dev.vinn.stoke
productName: Stoke
# Where electron-updater looks for new versions. Publishing a GitHub release
# with the installer and the generated latest.yml is what makes installed copies
# notice an update.
publish:
  provider: github
  owner: realvinn
  repo: stoke
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
# @lydell/node-pty ships prebuilt .node binaries; they must live outside the asar
# archive so the OS loader can dlopen them.
asarUnpack:
  - '**/node_modules/@lydell/node-pty*/**'
# build/icon.png (1024x1024) is the single source; electron-builder derives the
# .ico and .icns from it. Regenerate with `npm run icon` after editing icon.svg.
# Architectures are chosen by the npm scripts (--x64 / --arm64) rather than
# pinned here: an explicit `arch:` list in this file overrides the CLI flag, so
# `dist:win --x64` would still build every architecture and take three times as
# long.
win:
  icon: build/icon.png
  target:
    - target: nsis
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Stoke
mac:
  icon: build/icon.png
  target:
    - target: dmg
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}.${ext}
  # A PTY spawns child processes; the JIT/unsigned-memory entitlements keep
  # hardened runtime from killing them.
  #
  # Signing is left on auto-discovery. With no Developer ID installed,
  # electron-builder falls back to an ad-hoc signature, which is enough for a
  # personal build — Apple Silicon refuses to launch arm64 binaries that carry
  # no signature at all. See BUILDING.md if macOS still objects.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Required, not advisory. macOS terminates a process that asks for the
    # microphone with no usage string — it does not deny the request — so
    # omitting this turns dictation into an unexplained crash. The text is what
    # the system permission prompt shows, so it says who is listening and why.
    NSMicrophoneUsageDescription: >-
      Stoke uses the microphone for voice dictation, so you can speak a prompt
      instead of typing it. Audio is sent only to the speech server you
      configure and never to Stoke's developers.
linux:
  target: [AppImage]
  category: Development
