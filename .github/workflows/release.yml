# Builds and publishes a release for every platform and architecture Stoke ships.
#
# This exists because no installer can be produced on another platform's
# machine. The Windows NSIS installer needs Windows (or wine, which is its own
# kind of unreliable) and the mac dmg needs a Mac — and every release before
# this workflow shipped the Windows exe alone, because that is the machine the
# tag was cut on.
#
# ONE ARCH PER JOB, ON A NATIVE RUNNER, and it is not an optimisation. npm
# installs only the `@lydell/node-pty-<platform>-<arch>` matching the build
# host, and node-pty resolves that name at RUNTIME — so a cross-arch build
# produces an installer that installs, launches, and throws MODULE_NOT_FOUND on
# the first pty.start, with no build error anywhere. scripts/targets.mjs holds
# the whole argument and the whole list; this file reads the matrix from it
# rather than keeping a second copy, and every build job asserts what it
# actually packaged.
#
# Cutting a release:
#
#     npm version <version> --no-git-tag-version
#     git commit -am "<version>"
#     git tag -a v<version>          # -a, NOT a bare `git tag`
#     git push && git push --tags
#
# `-a` is load-bearing and this recipe used to omit it. The publish job below
# reads the *tag object's* message as the release notes; a lightweight tag has
# no message of its own, so it falls back to warning and publishing a release
# whose only note is the tag name. Write the notes in the tag annotation —
# first line becomes the release title, the rest becomes its body.
#
# The tag is what triggers this; the version in package.json is what
# electron-builder puts in the filenames and the update manifests, so the two
# must agree or installed copies compare against the wrong number.
name: Release

on:
  push:
    tags: ['v*']
  # Rehearse the whole matrix without cutting a tag. Publishing is keyed off the
  # trigger below, so a manual run builds and uploads artifacts but releases
  # nothing — which is the only safe way to find out that a build is broken.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - run: npm run typecheck

      # `npm run check` is NOT used here, and that is deliberate: it ends in
      # `npm run build`, which the build jobs below already do per-platform, and
      # two of its suites cannot run on a clean Linux runner. But the list of
      # what DOES run is no longer transcribed here — `scripts/ci-verify.mjs`
      # derives it from package.json's own `check` chain and runs everything in
      # it except a short, asserted exclusion list.
      #
      # That indirection is the fix for a bug this file had twice. It used to
      # carry twenty hand-written `- run:` lines under a comment telling the
      # next person to keep them in step with the chain. The instruction was
      # already being ignored when it was written — claude-config, activity,
      # restore and cli had drifted out — and after 36d491f fixed those by hand,
      # it drifted again within two days: verify:theme-gen (f403366),
      # verify:remote (7b65894) and verify:drop (4c42ba9) each joined `check`
      # and none of them joined this file. So the theme generator's
      # byte-for-byte reproduction, a dropped filename's shell quoting and where
      # the phone link points were all enforced locally and none of them gated a
      # release.
      #
      # Two lists that must agree, updated by hand, is the defect — not the
      # people who did not update the second one. There is one list now, and it
      # is the one you already have to edit. `npm run verify:ci -- --list`
      # prints what a push would run without running it.
      - run: npm run verify:ci

      - run: npm run build

  # The matrix, read out of scripts/targets.mjs rather than written here.
  #
  # It used to be five hand-written lines under `include:`, with the same flags
  # written a second time in package.json's dist:* scripts and nothing to
  # reconcile them — which is the defect this repo has already paid for twice
  # (scripts/ci-verify.mjs, CLAUDE.md gotcha 62), and it had already drifted:
  # package.json carried dist:win:arm64 and dist:mac:intel for platforms this
  # workflow never built. `npm run targets` prints what a release contains.
  prepare:
    name: Resolve the build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      # Pinned rather than taking whatever the runner image ships, for the same
      # reason the other jobs do: the whole matrix comes out of this step, and
      # "the image moved" is not a failure anybody would look for here.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: targets
        run: |
          set -euo pipefail
          node scripts/targets.mjs --list
          echo "matrix=$(node scripts/targets.mjs --matrix)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: [verify, prepare]
    # One platform failing must not delete the others' artifacts from the run.
    # A half-published release is recoverable; losing the built installers that
    # did work, because a sibling died, is just a wasted 20 minutes — and with
    # five legs instead of two that is five times more valuable than it was.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - run: npm run build

      # How the macOS build is signed, decided here because the matrix above
      # cannot read a secret.
      #
      # This one step decides whether any Mac can ever auto-update, so it is
      # worth being blunt about why. Squirrel.Mac installs an update by swapping
      # one .app for another, and first checks the downloaded bundle against the
      # RUNNING bundle's designated requirement. An ad-hoc signature's
      # requirement is `cdhash H"…"` — the hash of that one binary — which no
      # other build can satisfy by construction, so an ad-hoc release cannot
      # update anybody, ever. A certificate's requirement pins the leaf instead,
      # and any build carrying the same certificate satisfies it.
      #
      # With the secrets set, the release is signed with the same "Stoke"
      # certificate a local `npm run dist:mac` uses, and both directions work: an
      # installed release updates to the next release, and a locally built copy
      # updates to a release. Without them the build still happens and is still
      # valid — it just cannot update anyone, which is what every release up to
      # 0.6.1 shipped as. `RELEASE_IDENTITY` in src/main/codesign.ts names the
      # same certificate and has to change with it.
      #
      # Setting CSC_LINK/CSC_KEY_PASSWORD and stopping there does NOT work, and
      # it fails silently, which is why this step does the import by hand.
      # electron-builder imports a .p12 into a temporary keychain and sets its
      # partition list, and that is all — it never trusts the certificate
      # (`grep -rn add-trusted-cert node_modules/app-builder-lib/` finds nothing,
      # macCodeSign.js:165-168). It then searches with `security find-identity
      # -v`, valid identities only, and an untrusted self-signed certificate is
      # not valid: `codesign --sign` on one reports "no identity found" and signs
      # nothing. The build would fall through to a warning and ship an unsigned
      # bundle — the exact failure you started with, now looking fixed.
      #
      # CSC_LINK is also deliberately NOT exported to the build step. With it
      # set, electron-builder builds its own untrusted keychain and searches that
      # one instead of the trusted one this step just made
      # (macCodeSign.js:184-189). The identity comes from `mac.identity` in
      # electron-builder.yml.

      # Whether the certificate is configured, hoisted into a step output.
      # Read from `env` inside a script rather than tested in an `if:` because
      # context availability for `secrets` in a step conditional is a moving
      # target across runner versions, and a condition that silently evaluates
      # false here would quietly ship the ad-hoc fallback under a green tick.
      #
      # `-n`, so an EMPTY secret counts as absent. That is not hypothetical:
      # `gh secret set MAC_CSC_LINK < <(base64 -i Stoke.p12)` with no such file
      # sets the secret to zero bytes and still prints a tick, because the
      # process substitution opens an fd whether or not the command inside it
      # succeeded. The secret then exists, looks configured in the GitHub UI,
      # and contains nothing.
      - name: Check for a signing certificate
        id: signing
        if: runner.os == 'macOS'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import and trust the signing certificate
        if: steps.signing.outputs.have == 'true'
        env:
          CSC_P12_BASE64: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          TARGET_KEY: ${{ matrix.key }}
        run: |
          set -euo pipefail
          # Every trap this step already carries was found by RUNNING it, on an
          # arm64 image, and an Intel image is a different image with a
          # different LibreSSL and a different `security`. Nothing here is known
          # to work on macos-15-intel — it is stated rather than assumed, and
          # the facts a failure would need are printed before anything can fail.
          # The hard `find-identity | grep -q` below is what stops an Intel job
          # falling through to an unsigned bundle that looks fine.
          if [ "$TARGET_KEY" != "mac-arm64" ]; then
            echo "::notice::$TARGET_KEY runs the keychain import on $RUNNER_OS/$(uname -m), which only macos-14/arm64 has ever been measured on."
          fi
          sw_vers || true
          openssl version || true
          KC="$RUNNER_TEMP/stoke-signing.keychain-db"
          KCPW="$(openssl rand -base64 24)"
          echo "$CSC_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/stoke.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security import "$RUNNER_TEMP/stoke.p12" -k "$KC" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          # The certificate is pulled back out of the keychain that just imported
          # it, rather than out of the .p12 with openssl. Two reasons, and the
          # second is why the first version of this step failed.
          #
          # `security import` has already parsed the bundle by this point ("1
          # identity imported."), so the keychain is the authoritative copy and
          # `-p` prints it as PEM — no second parser, no passphrase handling, and
          # only the public half ever hits disk.
          #
          # And openssl here is a trap: this needs `-legacy` to read the
          # RC2-encrypted PKCS#12 that macOS writes, but **the GitHub macOS
          # runner ships LibreSSL 3.3.6**, which has no such flag —
          # `pkcs12: Unrecognized flag legacy`, exit 1, measured on run
          # 33144359100. A local machine with Homebrew's OpenSSL 3 first on PATH
          # does not reproduce it, which is exactly the kind of divergence not to
          # leave in a release pipeline.
          # The keychain is a POSITIONAL argument here, not `-k`. Unlike every
          # other `security` subcommand in this step, `find-certificate` takes
          # `[keychain...]` at the end — `-k` is rejected outright
          # (`illegal option -- k`, exit 2, run 33144532542).
          security find-certificate -c "Stoke" -p "$KC" > "$RUNNER_TEMP/stoke.cer"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/stoke.cer"
          rm -f "$RUNNER_TEMP/stoke.p12"
          # Fail here rather than shipping an unsigned app that looks fine.
          security find-identity -v -p codesigning | grep -q "Stoke"
          echo "MAC_SIGN_ARGS=" >> "$GITHUB_ENV"
          echo "::notice::$TARGET_KEY is signing with the release certificate — this build can auto-update."

      # The fallback, and it is a real signing pass rather than an absence of
      # one. `-c.mac.identity=-` asks for a genuine ad-hoc signature: correct
      # bundle identifier, sealed resources, entitlements applied. Leaving
      # CSC_IDENTITY_AUTO_DISCOVERY: false to do the job on its own is what
      # shipped until 0.5.3 and it is NOT the same thing — with no identity to
      # find, electron-builder skips signing altogether and ships whatever the
      # prebuilt Electron binary carried. Measured on the published
      # Stoke-0.5.2-arm64.zip:
      #
      #   Identifier   = Electron            <- not dev.vinn.stoke
      #   Signature    = adhoc,linker-signed <- Electron's own, not ours
      #   codesign --verify --strict -> exit 1, "code has no resources but
      #                                  signature indicates they must be present"
      #   entitlements = (none)              <- no mic, no JIT, no
      #                                         disable-library-validation
      #
      # Hardened runtime plus ad-hoc enforces library validation, which would
      # reject the prebuilt Electron framework — build/entitlements.mac.plist
      # already carries com.apple.security.cs.disable-library-validation, which
      # is exactly the escape electron-builder's own warning names.
      #
      # With two mac jobs this now warns twice, which is correct: an Intel
      # install and an Apple silicon install are separate update chains and
      # both are broken by an ad-hoc signature.
      - name: Fall back to an ad-hoc signature
        if: steps.signing.outputs.have == 'false'
        run: |
          {
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false"
            echo "MAC_SIGN_ARGS=-c.mac.identity=-"
          } >> "$GITHUB_ENV"
          echo "::warning::MAC_CSC_LINK is unset or empty, so ${{ matrix.key }} is ad-hoc signed and CANNOT auto-update. See BUILDING.md."

      # `--publish never`, always, even on a tag. Letting each matrix job
      # publish for itself is what the first attempt did, and both jobs raced to
      # create the release: GitHub does not treat a *draft* as unique per tag, so
      # two drafts appeared under v0.4.0-beta.3 with the assets split between
      # them — the Windows job reported success while its exe sat on a release
      # nobody would ever see. The publish job below is the only writer.
      #
      # electron-builder is invoked directly rather than through `npm run
      # dist:win -- …`: npm appends extra args to the end of the whole script
      # string, and these scripts are `npm run build && …` chains, so where a
      # flag lands depends on shell parsing rather than on anything stated.
      # `matrix.args` comes from scripts/targets.mjs, which is where the dist:*
      # scripts get theirs too, so the two cannot disagree about what a
      # platform's build is.
      #
      # latest.yml / latest-mac.yml / latest-linux.yml — the manifests
      # electron-updater actually reads — are still written into release/ under
      # `never`, because a publish provider is configured. Verified against a
      # local build before relying on it; without them an installed copy would
      # never notice the release.
      #
      # Split by platform rather than one step with an interpolated arg string,
      # because $MAC_SIGN_ARGS has to be expanded by a shell that understands it
      # and the Windows runner's default shell is PowerShell.
      - name: Build installers (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No Windows signing certificate is configured. CSC_LINK is read for
          # BOTH platforms by electron-builder, which is why the macOS
          # certificate is exported into the environment in a macOS-only step
          # above rather than set on the job.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # $MAC_SIGN_ARGS comes from whichever of the two signing steps above ran.
      - name: Build installers (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder ${{ matrix.args }} $MAC_SIGN_ARGS --publish never

      # Linux needs no signing of any kind: the AppImage is a self-contained
      # file with no Gatekeeper and no Authenticode to satisfy, and
      # AppImageUpdater replaces it in place.
      - name: Build installers (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder ${{ matrix.args }} --publish never

      # The one mistake in this whole workflow that has no build error.
      #
      # node-pty resolves "@lydell/node-pty-" + process.platform + "-" +
      # process.arch at RUNTIME, and npm only installs the sibling matching the
      # build host. A build that packaged the wrong one installs, launches, and
      # throws MODULE_NOT_FOUND on the first session — every tab dead, this run
      # green. So each job reads back what it actually packaged. It costs a
      # directory listing and it is the difference between a failed job and a
      # broken release.
      - name: Assert the packaged terminal binary matches this runner
        run: node scripts/assert-packaged-pty.mjs ${{ matrix.key }}

      # Uploaded even on failure: if a later step dies, the installer that did
      # build still exists somewhere retrievable rather than only inside a
      # container that has already been destroyed.
      #
      # Named per TARGET, not per runner: two macOS jobs on different runner
      # labels would still be one artifact name if this said matrix.runner, and
      # a name collision here is the same silent overwrite the publish job's
      # merge exists to prevent.
      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.key }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml

  publish:
    name: Publish release
    needs: build
    # Only a tag publishes. A workflow_dispatch run builds the whole matrix and
    # stops here, which is what makes it safe to rehearse.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checked out for scripts/, and for package.json's version. No `npm ci`:
      # the merger and the gate below import nothing outside node's own
      # builtins, precisely so this job stays a download and two node scripts.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # NO `merge-multiple`, and its absence is load-bearing.
      #
      # electron-builder names a manifest after the platform and — only on
      # Linux — the arch. Windows x64 and Windows arm64 both write `latest.yml`;
      # macOS arm64 and macOS x64 both write `latest-mac.yml`. With
      # merge-multiple the download flattens every artifact into one directory,
      # so those same-named files silently become one, whichever landed last
      # wins, and the losing arch's installed copies never learn the release
      # exists. The old guards below this line would all still have passed. Each
      # artifact lands in dist/<artifact-name>/ instead, and the merger reads
      # the tree.
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist

      - name: Merge the per-job update manifests
        run: |
          set -euo pipefail
          find dist -type f | sort
          node scripts/merge-update-manifests.mjs dist --out release-assets

      # The Windows portable zips, listed in the merged latest.yml.
      #
      # electron-builder writes no update info for a Windows zip, so each
      # Windows job's latest.yml names its installer and nothing else, and a
      # portable copy reading that feed would find no zip for its arch and
      # never be offered an update — silently, which is this workflow's
      # recurring failure shape. The zips are added HERE, to the merged
      # result, rather than to each job's manifest, so the per-job manifests
      # stay byte-for-byte electron-builder's own output and verify:manifests'
      # oracle (the merge must equal what one invocation would have written)
      # still means something. Appended after the installers, so files[0],
      # path and sha512 still name an .exe for NsisUpdater. Before the gate,
      # which refuses a feed missing either half for any Windows arch.
      - name: List the Windows portable zips in latest.yml
        run: node scripts/add-portable-to-manifest.mjs release-assets

      # The gate. A release that quietly drops one platform's feed looks
      # complete from every angle — green run, assets on the page — and the
      # dropped arch's installed copies simply stop updating, with nothing on
      # any screen saying so. That is exactly what v0.4.0-beta.3 shipped. The
      # rules are derived from scripts/targets.mjs, so adding a platform to the
      # matrix tightens this in the same edit.
      - name: Refuse to publish a release that cannot update somebody
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/check-release-assets.mjs release-assets --version "${TAG#v}"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -la release-assets

          # The tag's annotation is the release notes, so what is written once
          # at `git tag -a` is what people read.
          #
          # Read over the API rather than out of the checkout, even though
          # there is one now. actions/checkout materialises the pushed tag as a
          # *lightweight* ref pointing at the commit, so
          # `git for-each-ref --format='%(contents:subject)'` returns
          # the commit's subject instead of the tag's — which is how beta.3
          # first shipped titled "Publish from one job, because two racing jobs
          # made two drafts". Wrong, and wrong in a way that reads as plausible.
          # The API returns the real tag object, and needs no checkout at all.
          OBJ="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q '.object.sha + " " + .object.type')"
          if [ "${OBJ#* }" = "tag" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/${OBJ% *}" -q '.message' > tagmsg.txt
          else
            # A lightweight tag has no message of its own. Say so rather than
            # inventing notes from whatever commit it happens to point at.
            echo "::warning::$TAG is a lightweight tag, so it carries no notes. Use 'git tag -a' next time."
            printf '%s\n' "$TAG" > tagmsg.txt
          fi
          TITLE="$(head -1 tagmsg.txt)"
          tail -n +2 tagmsg.txt | sed '/./,$!d' > notes.md

          # A version with a hyphen in it is a prerelease by semver, which is
          # also how electron-updater decides whether to offer it to a stable
          # channel. Deriving it from the tag keeps the two from disagreeing.
          case "$TAG" in *-*) PRERELEASE=--prerelease ;; *) PRERELEASE= ;; esac

          # release-assets/, not dist/: dist/ is the download tree, one
          # directory per build job, with five un-merged latest*.yml files in
          # it. release-assets/ is what the merger produced — every artifact
          # flattened, one manifest per platform — and it is the only directory
          # that should ever reach a release.
          #
          # --repo explicitly rather than inferred from the checkout's remote,
          # because it is the one thing here that must not depend on how the
          # checkout was configured.
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "${TITLE:-$TAG}" \
            --notes-file notes.md \
            ${PRERELEASE}

  # Submit the release to winget — the Windows package manager — as a pull
  # request to microsoft/winget-pkgs, so `winget install realvinn.Stoke` gets
  # the version that was just published.
  #
  # A job HERE, not a workflow on `release: published`, because a release
  # created with GITHUB_TOKEN (the publish job above) triggers no other
  # workflow: GitHub drops events a GITHUB_TOKEN caused, to stop recursion. A
  # separate workflow would simply never run. `needs: publish` also means it
  # never runs for a release that failed its gate.
  #
  # Stable tags only — a version with a hyphen is a prerelease, published as one
  # above, and winget has no prerelease channel. scripts/winget.mjs refuses one
  # too, so a hand run holds the same rule.
  #
  # What it needs, once (BUILDING.md, "Publishing to winget"): a classic PAT
  # with public_repo in the WINGET_TOKEN secret, from an account that has a
  # fork of microsoft/winget-pkgs — Komac opens the pull request from that fork
  # and does not create it. Without the secret this job says so and does
  # nothing else, green: the release itself is already out.
  winget:
    name: Submit to winget
    needs: publish
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # For scripts/winget.mjs and scripts/targets.mjs. No `npm ci`: both
      # import only node's builtins and each other.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Read from `env` rather than tested in an `if:`, for the reason the
      # macOS signing step gives: `secrets` in a condition is not reliably
      # available, and a condition that quietly evaluates false would skip the
      # submission under a green tick. `-n`, so an empty secret is absent.
      - name: Check for a winget token
        id: token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -n "$WINGET_TOKEN" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::WINGET_TOKEN is unset or empty, so this release was not submitted to winget. BUILDING.md, 'Publishing to winget', has the one-time setup and how to re-run this job."
          fi

      # Anonymously, from the URLs the manifest will name — so the digest in
      # the manifest is the digest of the bytes winget will download, not of a
      # copy that merely should be the same. `--print-urls` derives the list
      # from scripts/targets.mjs, never from a second list here.
      - name: Download the Windows installers from the release
        if: steps.token.outputs.have == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir -p winget-in
          node scripts/winget.mjs --print-urls --version "$VERSION" > urls.txt
          cat urls.txt
          while read -r ARCH URL; do
            curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "winget-in/${URL##*/}" "$URL"
          done < urls.txt
          ls -la winget-in

      # The release's own publication date, read back rather than taken from
      # the clock, so a re-run days later still states the day it shipped.
      - name: Write the manifests
        if: steps.token.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DATE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" -q '.published_at' | cut -c1-10)"
          node scripts/winget.mjs --version "$VERSION" --installers winget-in --release-date "$DATE" --out winget-out
          for f in winget-out/manifests/r/realvinn/Stoke/"$VERSION"/*; do echo "----- $f"; cat "$f"; done

      # Pinned by version AND digest: this binary is handed a token that can
      # open pull requests as the account behind it.
      - name: Install Komac
        if: steps.token.outputs.have == 'true'
        run: |
          set -euo pipefail
          KOMAC_VERSION=2.16.0
          KOMAC_SHA256=7d2707fa6210f2789a3702de49fbd150b736dbf426ee0b9bc8e098736f9fd82d
          TARBALL="komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$TARBALL" \
            "https://github.com/russellbanks/Komac/releases/download/v${KOMAC_VERSION}/${TARBALL}"
          echo "${KOMAC_SHA256}  $RUNNER_TEMP/$TARBALL" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/komac"
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP/komac"
          KOMAC="$(find "$RUNNER_TEMP/komac" -type f -name komac | head -1)"
          if [ -z "$KOMAC" ]; then
            echo "::error::$TARBALL holds no file named komac:"; find "$RUNNER_TEMP/komac"; exit 1
          fi
          chmod +x "$KOMAC"
          "$KOMAC" --version
          echo "KOMAC=$KOMAC" >> "$GITHUB_ENV"

      # Never open a second pull request for a version winget already has or is
      # already reviewing — a re-run of this job must be safe. The contents API
      # answers 404 for a folder that does not exist; ANY other failure (rate
      # limit, outage) is not "absent" and fails the job rather than guessing.
      # Read with this repo's own token: winget-pkgs is public.
      - name: Skip a version winget already has
        id: dedupe
        if: steps.token.outputs.have == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          DIR="manifests/r/realvinn/Stoke/$VERSION"
          set +e
          OUT="$(gh api "repos/microsoft/winget-pkgs/contents/$DIR" 2>&1 >/dev/null)"
          CODE=$?
          set -e
          if [ "$CODE" -eq 0 ]; then
            echo "::notice::microsoft/winget-pkgs already has $DIR, so there is nothing to submit."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$OUT" in
            *"HTTP 404"*) ;;
            *) echo "::error::Could not tell whether microsoft/winget-pkgs has $DIR: $OUT"; exit 1 ;;
          esac
          gh pr list --repo microsoft/winget-pkgs --state open --limit 100 \
            --search "realvinn.Stoke $VERSION in:title" --json title,url > prs.json
          OPEN="$(VERSION="$VERSION" node -e '
            const prs = JSON.parse(require("fs").readFileSync("prs.json", "utf8"))
            const hit = prs.find((p) => p.title.includes("realvinn.Stoke") && p.title.split(/\s+/).includes(process.env.VERSION))
            process.stdout.write(hit ? hit.url : "")
          ')"
          if [ -n "$OPEN" ]; then
            echo "::notice::An open pull request already submits realvinn.Stoke $VERSION: $OPEN"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # The dry run is checked, not trusted. Komac rewrites every file it sends
      # and SILENTLY DROPS a file it cannot parse, exiting 0 — so a green dry
      # run can describe a two-file submission that winget-pkgs' validation will
      # reject a day later. All three ManifestType lines must be in what it
      # would send.
      - name: Dry run
        if: steps.token.outputs.have == 'true' && steps.dedupe.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          "$KOMAC" submit "winget-out/manifests/r/realvinn/Stoke/$VERSION" --dry-run 2>&1 | tee dry-run.txt
          for TYPE in version installer defaultLocale; do
            if ! grep -Eq "ManifestType: ${TYPE}\b" dry-run.txt; then
              echo "::error::Komac's dry run has no 'ManifestType: ${TYPE}' — it dropped that file. Refusing to submit."
              exit 1
            fi
          done

      # And the submission must name the pull request it opened. An exit 0
      # with no URL is a submission nobody can find, so it fails here instead.
      - name: Submit
        if: steps.token.outputs.have == 'true' && steps.dedupe.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          "$KOMAC" submit "winget-out/manifests/r/realvinn/Stoke/$VERSION" --yes 2>&1 | tee submit.txt
          URL="$(grep -oE 'https://github\.com/microsoft/winget-pkgs/pull/[0-9]+' submit.txt | head -1 || true)"
          if [ -z "$URL" ]; then
            echo "::error::Komac exited 0 but printed no microsoft/winget-pkgs pull request URL. Check the fork and the token."
            exit 1
          fi
          echo "::notice::winget pull request: $URL"
          {
            echo "### winget"
            echo ""
            echo "Submitted realvinn.Stoke $VERSION: $URL"
          } >> "$GITHUB_STEP_SUMMARY"
