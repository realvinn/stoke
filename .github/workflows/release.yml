# Builds and publishes a release for both platforms.
#
# This exists because neither installer can be produced on the other's machine.
# The Windows NSIS installer needs Windows (or wine, which is its own kind of
# unreliable), and the mac dmg needs a Mac — and every release before this one
# shipped the Windows exe alone, because that is the machine the tag was cut on.
# A tag pushed from either desk now produces both.
#
# Cutting a release:
#
#     npm version 0.4.0-beta.3 --no-git-tag-version
#     git commit -am "0.4.0-beta.3" && git tag v0.4.0-beta.3
#     git push && git push --tags
#
# The tag is what triggers this; the version in package.json is what
# electron-builder puts in the filenames and the update manifests, so the two
# must agree or installed copies compare against the wrong number.
name: Release

on:
  push:
    tags: ['v*']
  # Rehearse the whole matrix without cutting a tag. Publishing is keyed off the
  # trigger below, so a manual run builds and uploads artifacts but releases
  # nothing — which is the only safe way to find out that a build is broken.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - run: npm run typecheck

      # `npm run check` is NOT used here, and that is deliberate rather than an
      # oversight. Two of its suites are machine-dependent by design and cannot
      # pass on a clean runner:
      #
      #   verify:context  reads the real transcripts in ~/.claude/projects to
      #                   check the context meter against actual sessions. On a
      #                   runner that directory does not exist and the suite
      #                   throws ENOENT. Its value is that it runs against real
      #                   data, so making it synthesise fixtures would delete the
      #                   reason it exists.
      #   verify:ssh      fails on every commit including the merge base:
      #                   OpenSSH >= 9 rejects the suite's own two-word host
      #                   alias fixture ("hostname contains invalid characters").
      #                   Pre-existing and unrelated to any release.
      #
      # Everything else is pure and runs anywhere, so it runs here. Keep this
      # list in step with package.json's `check` chain when a suite is added.
      - run: npm run verify:statusline
      - run: npm run verify:unicode
      - run: npm run verify:usage
      - run: npm run verify:profiles
      - run: npm run verify:settings
      - run: npm run verify:folders
      - run: npm run verify:color
      - run: npm run verify:worklog-gate
      - run: npm run verify:tabs
      - run: npm run verify:worklog-runner
      - run: npm run verify:worklog-retry
      - run: npm run verify:worklog-recall
      - run: npm run verify:worklog-autoscan

      - run: npm run build

  build:
    name: ${{ matrix.name }}
    needs: verify
    # One platform failing must not delete the other's artifacts from the run.
    # A half-published release is recoverable; losing the built installer that
    # did work, because its sibling died, is just a wasted 20 minutes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --win --x64
          - name: macOS arm64
            os: macos-14
            args: --mac --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - run: npm run build

      # `--publish never`, always, even on a tag. Letting each matrix job
      # publish for itself is what the first attempt did, and both jobs raced to
      # create the release: GitHub does not treat a *draft* as unique per tag, so
      # two drafts appeared under v0.4.0-beta.3 with the assets split between
      # them — the Windows job reported success while its exe sat on a release
      # nobody would ever see. The publish job below is the only writer.
      #
      # electron-builder is invoked directly rather than through `npm run
      # dist:win -- …`: npm appends extra args to the end of the whole script
      # string, and these scripts are `npm run build && …` chains, so where a
      # flag lands depends on shell parsing rather than on anything stated. The
      # flags here are the same ones package.json uses.
      #
      # latest.yml / latest-mac.yml — the manifests electron-updater actually
      # reads — are still written into release/ under `never`, because a publish
      # provider is configured. Verified against a local build before relying on
      # it; without them an installed copy would never notice the release.
      - name: Build installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No Developer ID is configured, so stop electron-builder hunting the
          # keychain for one and failing when it finds nothing. The result is an
          # ad-hoc signature: enough for the dmg to launch after right-click ->
          # Open, and NOT enough for Squirrel.Mac to apply an auto-update, which
          # verifies the signature of the downloaded app. Mac auto-update stays
          # broken until a real certificate exists.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          #
          # To turn Mac auto-update on later, add these repository secrets and
          # delete the line above. Nothing else here has to change:
          #   CSC_LINK             base64 of a Developer ID .p12
          #   CSC_KEY_PASSWORD     its password
          #   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID  (notarising)

      # Uploaded even on failure: if a later step dies, the installer that did
      # build still exists somewhere retrievable rather than only inside a
      # container that has already been destroyed.
      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.blockmap
            release/latest*.yml

  publish:
    name: Publish release
    needs: build
    # Only a tag publishes. A workflow_dispatch run builds the whole matrix and
    # stops here, which is what makes it safe to rehearse.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tag's own annotation becomes the release notes, so what is written
      # once at `git tag -a` is what people read. Needs the tag object, which a
      # shallow checkout does not fetch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -la dist

          # Both manifests must survive to the release or that platform's
          # installed copies never learn the version exists. Checked explicitly
          # because their absence is silent: the release looks complete.
          for manifest in latest.yml latest-mac.yml; do
            test -f "dist/$manifest" || { echo "::error::dist/$manifest missing — $manifest platform could not auto-update"; exit 1; }
          done

          TITLE="$(git for-each-ref "refs/tags/$TAG" --format='%(contents:subject)')"
          git for-each-ref "refs/tags/$TAG" --format='%(contents:body)' > notes.md

          # A version with a hyphen in it is a prerelease by semver, which is
          # also how electron-updater decides whether to offer it to a stable
          # channel. Deriving it from the tag keeps the two from disagreeing.
          case "$TAG" in *-*) PRERELEASE=--prerelease ;; *) PRERELEASE= ;; esac

          gh release create "$TAG" dist/* \
            --title "${TITLE:-$TAG}" \
            --notes-file notes.md \
            ${PRERELEASE}
