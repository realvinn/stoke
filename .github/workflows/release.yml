# Builds and publishes a release for both platforms.
#
# This exists because neither installer can be produced on the other's machine.
# The Windows NSIS installer needs Windows (or wine, which is its own kind of
# unreliable), and the mac dmg needs a Mac — and every release before this one
# shipped the Windows exe alone, because that is the machine the tag was cut on.
# A tag pushed from either desk now produces both.
#
# Cutting a release:
#
#     npm version <version> --no-git-tag-version
#     git commit -am "<version>"
#     git tag -a v<version>          # -a, NOT a bare `git tag`
#     git push && git push --tags
#
# `-a` is load-bearing and this recipe used to omit it. The publish job below
# reads the *tag object's* message as the release notes; a lightweight tag has
# no message of its own, so it falls back to warning and publishing a release
# whose only note is the tag name. Write the notes in the tag annotation —
# first line becomes the release title, the rest becomes its body.
#
# The tag is what triggers this; the version in package.json is what
# electron-builder puts in the filenames and the update manifests, so the two
# must agree or installed copies compare against the wrong number.
name: Release

on:
  push:
    tags: ['v*']
  # Rehearse the whole matrix without cutting a tag. Publishing is keyed off the
  # trigger below, so a manual run builds and uploads artifacts but releases
  # nothing — which is the only safe way to find out that a build is broken.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - run: npm run typecheck

      # `npm run check` is NOT used here, and that is deliberate rather than an
      # oversight. One of its suites is machine-dependent by design and cannot
      # pass on a clean runner:
      #
      #   verify:context  reads the real transcripts in ~/.claude/projects to
      #                   check the context meter against actual sessions. On a
      #                   runner that directory does not exist and the suite
      #                   throws ENOENT. Its value is that it runs against real
      #                   data, so making it synthesise fixtures would delete the
      #                   reason it exists.
      #
      # verify:ssh used to be excluded here too, for a reason that no longer
      # holds: it asserted six host aliases out of one particular desk's real
      # ~/.ssh/config, and it threw on OpenSSH >= 9, which rejects its own
      # two-word alias fixture. Both were fixed, so it runs here now — and it is
      # worth running, because it is the only suite that checks the argv Stoke
      # hands a remote `claude` against what ssh itself resolves.
      #
      # verify:selection is excluded for a different reason: it is not impure,
      # it just needs a browser. It opens a real Electron BrowserWindow to drive
      # xterm's own DOM event handling, which is the only place the bug it
      # guards is visible at all — and a Linux runner has no display, so it would
      # need xvfb rather than merely being added to the list below. Left out
      # deliberately until someone wires that up; it runs in `npm run check`.
      #
      # Everything else is pure and runs anywhere, so it runs here. Keep this
      # list in step with package.json's `check` chain when a suite is added.
      #
      # That instruction was already being ignored when it was written: four of
      # the chain's suites had drifted out of this list — claude-config,
      # activity, restore and cli — so `npm run check` enforced them and CI did
      # not, which is the wrong way round for the list a release gate reads. All
      # four are hermetic (claude-config runs against a temp CLAUDE_CONFIG_DIR,
      # restore says "no electron, no window" in its own header, activity builds
      # synthetic transcripts, cli redirects HOME into a temp tree) and all four
      # pass on a clean checkout, so there was never a reason for the gap. The
      # two exclusions above are the only intended ones.
      - run: npm run verify:statusline
      - run: npm run verify:unicode
      - run: npm run verify:usage
      - run: npm run verify:profiles
      - run: npm run verify:settings
      - run: npm run verify:claude-config
      - run: npm run verify:folders
      - run: npm run verify:color
      - run: npm run verify:activity
      - run: npm run verify:worklog-gate
      - run: npm run verify:cli
      - run: npm run verify:tabs
      - run: npm run verify:restore
      - run: npm run verify:shortcuts
      - run: npm run verify:updates
      - run: npm run verify:worklog-runner
      - run: npm run verify:worklog-retry
      - run: npm run verify:worklog-recall
      - run: npm run verify:worklog-autoscan
      - run: npm run verify:ssh

      - run: npm run build

  build:
    name: ${{ matrix.name }}
    needs: verify
    # One platform failing must not delete the other's artifacts from the run.
    # A half-published release is recoverable; losing the built installer that
    # did work, because its sibling died, is just a wasted 20 minutes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --win --x64
          - name: macOS arm64
            os: macos-14
            # The mac flags are NOT here, because how this build is signed
            # depends on a secret and a matrix cannot read one. See "Resolve
            # macOS signing" below.
            args: --mac --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      - run: npm run build

      # How the macOS build is signed, decided here because the matrix above
      # cannot read a secret.
      #
      # This one step decides whether any Mac can ever auto-update, so it is
      # worth being blunt about why. Squirrel.Mac installs an update by swapping
      # one .app for another, and first checks the downloaded bundle against the
      # RUNNING bundle's designated requirement. An ad-hoc signature's
      # requirement is `cdhash H"…"` — the hash of that one binary — which no
      # other build can satisfy by construction, so an ad-hoc release cannot
      # update anybody, ever. A certificate's requirement pins the leaf instead,
      # and any build carrying the same certificate satisfies it.
      #
      # With the secrets set, the release is signed with the same "Stoke"
      # certificate a local `npm run dist:mac` uses, and both directions work: an
      # installed release updates to the next release, and a locally built copy
      # updates to a release. Without them the build still happens and is still
      # valid — it just cannot update anyone, which is what every release up to
      # 0.6.1 shipped as. `RELEASE_IDENTITY` in src/main/codesign.ts names the
      # same certificate and has to change with it.
      #
      # Setting CSC_LINK/CSC_KEY_PASSWORD and stopping there does NOT work, and
      # it fails silently, which is why this step does the import by hand.
      # electron-builder imports a .p12 into a temporary keychain and sets its
      # partition list, and that is all — it never trusts the certificate
      # (`grep -rn add-trusted-cert node_modules/app-builder-lib/` finds nothing,
      # macCodeSign.js:165-168). It then searches with `security find-identity
      # -v`, valid identities only, and an untrusted self-signed certificate is
      # not valid: `codesign --sign` on one reports "no identity found" and signs
      # nothing. The build would fall through to a warning and ship an unsigned
      # bundle — the exact failure you started with, now looking fixed.
      #
      # CSC_LINK is also deliberately NOT exported to the build step. With it
      # set, electron-builder builds its own untrusted keychain and searches that
      # one instead of the trusted one this step just made
      # (macCodeSign.js:184-189). The identity comes from `mac.identity` in
      # electron-builder.yml.

      # Whether the certificate is configured, hoisted into a step output.
      # Read from `env` inside a script rather than tested in an `if:` because
      # context availability for `secrets` in a step conditional is a moving
      # target across runner versions, and a condition that silently evaluates
      # false here would quietly ship the ad-hoc fallback under a green tick.
      #
      # `-n`, so an EMPTY secret counts as absent. That is not hypothetical:
      # `gh secret set MAC_CSC_LINK < <(base64 -i Stoke.p12)` with no such file
      # sets the secret to zero bytes and still prints a tick, because the
      # process substitution opens an fd whether or not the command inside it
      # succeeded. The secret then exists, looks configured in the GitHub UI,
      # and contains nothing.
      - name: Check for a signing certificate
        id: signing
        if: runner.os == 'macOS'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          if [ -n "$MAC_CSC_LINK" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import and trust the signing certificate
        if: steps.signing.outputs.have == 'true'
        env:
          CSC_P12_BASE64: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/stoke-signing.keychain-db"
          KCPW="$(openssl rand -base64 24)"
          echo "$CSC_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/stoke.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security import "$RUNNER_TEMP/stoke.p12" -k "$KC" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          # The certificate is pulled back out of the keychain that just imported
          # it, rather than out of the .p12 with openssl. Two reasons, and the
          # second is why the first version of this step failed.
          #
          # `security import` has already parsed the bundle by this point ("1
          # identity imported."), so the keychain is the authoritative copy and
          # `-p` prints it as PEM — no second parser, no passphrase handling, and
          # only the public half ever hits disk.
          #
          # And openssl here is a trap: this needs `-legacy` to read the
          # RC2-encrypted PKCS#12 that macOS writes, but **the GitHub macOS
          # runner ships LibreSSL 3.3.6**, which has no such flag —
          # `pkcs12: Unrecognized flag legacy`, exit 1, measured on run
          # 33144359100. A local machine with Homebrew's OpenSSL 3 first on PATH
          # does not reproduce it, which is exactly the kind of divergence not to
          # leave in a release pipeline.
          # The keychain is a POSITIONAL argument here, not `-k`. Unlike every
          # other `security` subcommand in this step, `find-certificate` takes
          # `[keychain...]` at the end — `-k` is rejected outright
          # (`illegal option -- k`, exit 2, run 33144532542).
          security find-certificate -c "Stoke" -p "$KC" > "$RUNNER_TEMP/stoke.cer"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/stoke.cer"
          rm -f "$RUNNER_TEMP/stoke.p12"
          # Fail here rather than shipping an unsigned app that looks fine.
          security find-identity -v -p codesigning | grep -q "Stoke"
          echo "MAC_SIGN_ARGS=" >> "$GITHUB_ENV"
          echo "::notice::Signing with the release certificate — this build can auto-update."

      # The fallback, and it is a real signing pass rather than an absence of
      # one. `-c.mac.identity=-` asks for a genuine ad-hoc signature: correct
      # bundle identifier, sealed resources, entitlements applied. Leaving
      # CSC_IDENTITY_AUTO_DISCOVERY: false to do the job on its own is what
      # shipped until 0.5.3 and it is NOT the same thing — with no identity to
      # find, electron-builder skips signing altogether and ships whatever the
      # prebuilt Electron binary carried. Measured on the published
      # Stoke-0.5.2-arm64.zip:
      #
      #   Identifier   = Electron            <- not dev.vinn.stoke
      #   Signature    = adhoc,linker-signed <- Electron's own, not ours
      #   codesign --verify --strict -> exit 1, "code has no resources but
      #                                  signature indicates they must be present"
      #   entitlements = (none)              <- no mic, no JIT, no
      #                                         disable-library-validation
      #
      # Hardened runtime plus ad-hoc enforces library validation, which would
      # reject the prebuilt Electron framework — build/entitlements.mac.plist
      # already carries com.apple.security.cs.disable-library-validation, which
      # is exactly the escape electron-builder's own warning names.
      - name: Fall back to an ad-hoc signature
        if: steps.signing.outputs.have == 'false'
        run: |
          {
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false"
            echo "MAC_SIGN_ARGS=-c.mac.identity=-"
          } >> "$GITHUB_ENV"
          echo "::warning::MAC_CSC_LINK is unset or empty, so this macOS build is ad-hoc signed and CANNOT auto-update. See BUILDING.md."

      # `--publish never`, always, even on a tag. Letting each matrix job
      # publish for itself is what the first attempt did, and both jobs raced to
      # create the release: GitHub does not treat a *draft* as unique per tag, so
      # two drafts appeared under v0.4.0-beta.3 with the assets split between
      # them — the Windows job reported success while its exe sat on a release
      # nobody would ever see. The publish job below is the only writer.
      #
      # electron-builder is invoked directly rather than through `npm run
      # dist:win -- …`: npm appends extra args to the end of the whole script
      # string, and these scripts are `npm run build && …` chains, so where a
      # flag lands depends on shell parsing rather than on anything stated. The
      # flags here are the same ones package.json uses.
      #
      # latest.yml / latest-mac.yml — the manifests electron-updater actually
      # reads — are still written into release/ under `never`, because a publish
      # provider is configured. Verified against a local build before relying on
      # it; without them an installed copy would never notice the release.
      #
      # Split by platform rather than one step with an interpolated arg string,
      # because $MAC_SIGN_ARGS has to be expanded by a shell that understands it
      # and the Windows runner's default shell is PowerShell.
      - name: Build installers (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No Windows signing certificate is configured. CSC_LINK is read for
          # BOTH platforms by electron-builder, which is why the macOS
          # certificate is exported into the environment in a macOS-only step
          # above rather than set on the job.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # $MAC_SIGN_ARGS comes from whichever of the two signing steps above ran.
      - name: Build installers (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder ${{ matrix.args }} $MAC_SIGN_ARGS --publish never

      # Uploaded even on failure: if a later step dies, the installer that did
      # build still exists somewhere retrievable rather than only inside a
      # container that has already been destroyed.
      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest*.yml

  publish:
    name: Publish release
    needs: build
    # Only a tag publishes. A workflow_dispatch run builds the whole matrix and
    # stops here, which is what makes it safe to rehearse.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls -la dist

          # Both manifests must survive to the release or that platform's
          # installed copies never learn the version exists. Checked explicitly
          # because their absence is silent: the release looks complete.
          for manifest in latest.yml latest-mac.yml; do
            test -f "dist/$manifest" || { echo "::error::dist/$manifest missing — $manifest platform could not auto-update"; exit 1; }
          done

          # A present latest-mac.yml is not sufficient, and believing it was is
          # how v0.4.0-beta.3 shipped a Mac that could not update itself. The
          # manifest listed only the dmg; electron-updater's MacUpdater searches
          # the feed for a .zip and rejects "dmg" and "pkg" by name, so the
          # download threw before fetching a byte while the release looked
          # complete from every angle here. Assert the archive is really there.
          grep -q '\.zip' dist/latest-mac.yml || {
            echo "::error::dist/latest-mac.yml lists no .zip — macOS cannot auto-update from this release"
            exit 1
          }
          ls dist/*.zip >/dev/null 2>&1 || {
            echo "::error::no .zip in dist — the macOS update archive was not built"
            exit 1
          }

          # The tag's annotation is the release notes, so what is written once
          # at `git tag -a` is what people read.
          #
          # Read over the API rather than out of a checkout. actions/checkout
          # materialises the pushed tag as a *lightweight* ref pointing at the
          # commit, so `git for-each-ref --format='%(contents:subject)'` returns
          # the commit's subject instead of the tag's — which is how beta.3
          # first shipped titled "Publish from one job, because two racing jobs
          # made two drafts". Wrong, and wrong in a way that reads as plausible.
          # The API returns the real tag object, and needs no checkout at all.
          OBJ="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" -q '.object.sha + " " + .object.type')"
          if [ "${OBJ#* }" = "tag" ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/${OBJ% *}" -q '.message' > tagmsg.txt
          else
            # A lightweight tag has no message of its own. Say so rather than
            # inventing notes from whatever commit it happens to point at.
            echo "::warning::$TAG is a lightweight tag, so it carries no notes. Use 'git tag -a' next time."
            printf '%s\n' "$TAG" > tagmsg.txt
          fi
          TITLE="$(head -1 tagmsg.txt)"
          tail -n +2 tagmsg.txt | sed '/./,$!d' > notes.md

          # A version with a hyphen in it is a prerelease by semver, which is
          # also how electron-updater decides whether to offer it to a stable
          # channel. Deriving it from the tag keeps the two from disagreeing.
          case "$TAG" in *-*) PRERELEASE=--prerelease ;; *) PRERELEASE= ;; esac

          # --repo explicitly: with no checkout there is no git remote for gh
          # to infer it from.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "${TITLE:-$TAG}" \
            --notes-file notes.md \
            ${PRERELEASE}
