# docker compose -f hub/compose.yaml up -d   (from the repo root)
#
# The hub with its data in a named volume and the edge secret as a Docker
# secret read from a file beside this one (hub/edge-secret, never committed —
# hub/.gitignore). Not run on any machine yet.

services:
  stoke-hub:
    build:
      context: ..
      dockerfile: hub/Dockerfile
    image: stoke-hub:local
    restart: unless-stopped
    environment:
      HUB_EDGE_SECRET_FILE: /run/secrets/hub_edge_secret
      # Uncomment (and the port below) to open the LAN listener.
      # STOKE_HUB_LAN: 0.0.0.0:8788
    secrets:
      - hub_edge_secret
    ports:
      # The edge listener, on the HOST's loopback only: cloudflared on the NUC
      # reaches it, nothing on the network does.
      - "127.0.0.1:8787:8787"
      # - "8788:8788"
    volumes:
      - stoke-hub-data:/data
    stop_grace_period: 20s
    # Docker's default json-file driver keeps every line forever. The hub caps
    # strangers' refusals in its own log, but a cap on the file is what bounds
    # the disk whatever writes to it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  hub_edge_secret:
    file: ./edge-secret

volumes:
  stoke-hub-data: {}
