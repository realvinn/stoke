<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Source of truth for the app icon. Run `npm run icon` to rasterise this to
    build/icon.png, which electron-builder converts to .ico and .icns.

    The mark is the same flame used in the title bar, on the ember background
    the rest of the app is built around.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241c17"/>
      <stop offset="1" stop-color="#0d0b0a"/>
    </linearGradient>
    <linearGradient id="flame" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffc48c"/>
      <stop offset="0.45" stop-color="#ff9552"/>
      <stop offset="1" stop-color="#e85f24"/>
    </linearGradient>
    <linearGradient id="core" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fff3e2"/>
      <stop offset="1" stop-color="#ffcf94"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#ff9552" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ff9552" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <circle cx="512" cy="600" r="340" fill="url(#glow)"/>

  <g transform="translate(200,196) scale(0.61)">
    <path
      d="M512 76.8c166.4 153.6 294.4 288 294.4 460.8a294.4 294.4 0 1 1-588.8 0c0-83.2 32-153.6 83.2-224 19.2 64 57.6 108.8 102.4 128 6.4-140.8 44.8-256 108.8-364.8z"
      fill="url(#flame)"/>
    <path
      d="M512 921.6a160 160 0 0 1-160-160c0-96 76.8-160 160-275.2 83.2 115.2 160 179.2 160 275.2a160 160 0 0 1-160 160z"
      fill="url(#core)"/>
  </g>
</svg>
