<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      No maximum-scale: pinch-zoom stays available for the terminal (PX-18).
      The composer's 16px font is what keeps iOS from zooming on focus.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#181716" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stoke" />
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <title>Stoke</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
